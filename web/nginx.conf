# =====================================================================
# Cấu hình nginx cho giao diện MED-EQUIP.
#
# Đóng vai trò ba việc:
#  1. Phục vụ file tĩnh sau khi Vite build.
#  2. Chuyển tiếp /api và /uploads sang container API, để trình duyệt
#     chỉ cần nhớ một địa chỉ — tránh rắc rối CORS khi chạy Docker.
#  3. Fallback về index.html cho các đường dẫn của react-router
#     (SPA routing), trừ khi là tài nguyên có phần mở rộng file thật.
# =====================================================================

upstream medequip_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Giới hạn thân request. API cho phép 10 MB mỗi tệp bằng chứng
    # (EvidenceRules.MaxBytes); để nginx rộng hơn một chút (12 MB, dư cho
    # phần multipart) thì tệp quá cỡ vẫn tới được API và nhận lỗi JSON
    # tiếng Việt, thay vì nginx trả 413 HTML mà giao diện không đọc được.
    # Mặc định của nginx là 1 MB — ảnh chụp từ điện thoại thường vượt mức.
    client_max_body_size 12m;

    # ---- Nén và cache tài nguyên có gắn hash trong tên ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html không được cache, nếu không người dùng cứ bị kẹt bản build cũ
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- Chuyển tiếp API ----
    location /api/ {
        proxy_pass         http://medequip_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- File bằng chứng tải lên ----
    # PHẢI dùng ^~: nếu để prefix thường, location regex phía trên
    # (~* \.(png|jpg|...)$) sẽ THẮNG và nginx đi tìm file trong
    # /usr/share/nginx/html/uploads → 404, không bao giờ chuyển tiếp
    # sang API. ^~ bắt prefix thắng regex.
    location ^~ /uploads/ {
        proxy_pass         http://medequip_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- Điểm kiểm tra sống của container ----
    location = /healthz {
        access_log off;
        # Dùng default_type chứ không add_header: add_header chỉ ghi thêm
        # header, không thay kiểu nội dung, nên phản hồi sẽ không có
        # Content-Type text/plain và client đọc ra mảng byte.
        default_type text/plain;
        return 200 'ok';
    }

    # ---- Điểm vào của Keycloak gọi lại ----
    location /auth/ {
        try_files $uri $uri/ /index.html;
    }

    # ---- SPA routing ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
